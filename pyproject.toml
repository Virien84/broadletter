[project]
name = "broadletter"
version = "0.1.0"
description = "Turns your Gmail newsletters into one two-host news broadcast, using open-weight models running locally."
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "ollama>=0.5",
    "pydantic>=2.9",
]

[project.scripts]
broadletter = "broadletter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broadletter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
