# Copy this file to config.toml and adjust it. config.toml is git-ignored.

[gmail]
# Gmail label that marks the newsletters to process (create it with a Gmail filter).
label = "Newsletter"
# Label added to newsletters that were digested, right before they are moved to trash.
processed_label = "Broadletter/Digested"
# Label added to expired newsletters, right before they are moved to trash.
expired_label = "Broadletter/Expired"
# Senders whose emails go to "Letters to the Editor" instead of the broadcast.
personal_senders = []
# Maximum newsletters per run (guards against surprises and endless runs).
max_messages = 30
# Newsletters this many days old or older are discarded unread: never downloaded,
# never sent to the model, just labeled and moved to trash.
max_age_days = 30
# Maximum expired newsletters discarded per run.
max_expired = 200

[ollama]
host = "http://127.0.0.1:11434"
chat_model = "gemma4:e4b-it-qat"
embed_model = "embeddinggemma:300m"
# Maximum characters of each newsletter passed to the model.
max_chars = 12000
# Layers offloaded to the GPU: leave unset to let Ollama decide; 0 = CPU only.
# num_gpu = 0

[digest]
# Cosine similarity above which two news items are considered the same story.
dedupe_threshold = 0.70
# Stories that get a full segment; the rest go to a quick-hits round at the end.
max_segments = 12
hosts = ["Maya", "Leo"]
title = "Broadletter"
language = "English"
